[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:laravel-worker]
command=bash /usr/local/bin/dev-worker queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=3600

[program:webhook-logs-worker]
command=bash /usr/local/bin/dev-worker webhook-logs:work
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=60

[program:laravel-scheduler]
command=bash /usr/local/bin/dev-worker schedule:work
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true

[program:reverb]
command=bash /usr/local/bin/dev-worker reverb:start --no-interaction
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=30

[program:broadcasting-worker]
command=bash /usr/local/bin/dev-worker queue:work redis --queue=broadcasting --sleep=1 --tries=3 --timeout=30 --max-time=3600
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=60

[program:notifications-worker]
command=bash /usr/local/bin/dev-worker queue:work --queue=notifications --sleep=1 --tries=3 --timeout=60 --max-time=3600
autostart=true
autorestart=true
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=90
